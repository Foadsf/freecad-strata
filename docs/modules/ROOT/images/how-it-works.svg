<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6b7a"/>
    </marker>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f1fe"/><stop offset="1" stop-color="#dbe8fd"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="#ffffff"/>

  <!-- engineer -->
  <rect x="20" y="40" width="170" height="80" rx="12" fill="#0f1b2d"/>
  <text x="105" y="74" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">FreeCAD</text>
  <text x="105" y="97" fill="#b9c8e6" font-size="13" text-anchor="middle">you edit and save</text>

  <!-- project folder -->
  <rect x="240" y="20" width="380" height="320" rx="16" fill="url(#g1)" stroke="#c7d7f5"/>
  <text x="260" y="48" fill="#0f1b2d" font-size="15" font-weight="700">Project folder</text>
  <text x="260" y="68" fill="#5f6b7a" font-size="12">your normal FreeCAD files, unchanged format</text>

  <rect x="260" y="84" width="340" height="74" rx="10" fill="#fff" stroke="#e2e6eb"/>
  <text x="276" y="108" fill="#1c2733" font-size="13" font-family="JetBrains Mono, Consolas, monospace">Gearbox.FCStd</text>
  <text x="276" y="128" fill="#1c2733" font-size="13" font-family="JetBrains Mono, Consolas, monospace">Parts/Bracket.FCStd</text>
  <text x="276" y="148" fill="#1c2733" font-size="13" font-family="JetBrains Mono, Consolas, monospace">Parts/Shaft.FCStd</text>

  <rect x="260" y="182" width="340" height="140" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="276" y="206" fill="#1f6feb" font-size="13" font-weight="700" font-family="JetBrains Mono, Consolas, monospace">.strata/  (hidden)</text>
  <rect x="276" y="218" width="150" height="88" rx="8" fill="#e9f1fe"/>
  <text x="351" y="240" fill="#0f1b2d" font-size="12.5" font-weight="700" text-anchor="middle">repo.git</text>
  <text x="351" y="258" fill="#5f6b7a" font-size="11.5" text-anchor="middle">history, versions,</text>
  <text x="351" y="274" fill="#5f6b7a" font-size="11.5" text-anchor="middle">workspaces, releases</text>
  <text x="351" y="292" fill="#5f6b7a" font-size="11.5" text-anchor="middle">(text content)</text>
  <rect x="436" y="218" width="148" height="88" rx="8" fill="#f6f8fb"/>
  <text x="510" y="240" fill="#0f1b2d" font-size="12.5" font-weight="700" text-anchor="middle">blobs/</text>
  <text x="510" y="258" fill="#5f6b7a" font-size="11.5" text-anchor="middle">thumbnails, colours,</text>
  <text x="510" y="274" fill="#5f6b7a" font-size="11.5" text-anchor="middle">binary BREP</text>
  <text x="510" y="292" fill="#5f6b7a" font-size="11.5" text-anchor="middle">(this computer only)</text>

  <!-- arrows -->
  <path d="M190 80 L255 110" stroke="#5f6b7a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="196" y="120" fill="#5f6b7a" font-size="11.5">save</text>
  <path d="M430 160 L430 212" stroke="#1f6feb" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 4"/>
  <text x="438" y="188" fill="#1f6feb" font-size="11.5">every save is recorded</text>

  <!-- shared location -->
  <rect x="680" y="182" width="200" height="140" rx="14" fill="#0f1b2d"/>
  <text x="780" y="214" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">Shared location</text>
  <text x="780" y="240" fill="#b9c8e6" font-size="12" text-anchor="middle">network folder,</text>
  <text x="780" y="258" fill="#b9c8e6" font-size="12" text-anchor="middle">synced drive or</text>
  <text x="780" y="276" fill="#b9c8e6" font-size="12" text-anchor="middle">Git server</text>
  <text x="780" y="302" fill="#7fb0ff" font-size="11.5" text-anchor="middle">optional</text>
  <path d="M430 262 L 0 0" stroke="none"/>
  <path d="M588 250 L672 250" stroke="#5f6b7a" stroke-width="2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="630" y="240" fill="#5f6b7a" font-size="11.5" text-anchor="middle">Sync</text>
  <text x="780" y="72" fill="#0f1b2d" font-size="13" font-weight="700" text-anchor="middle">Colleagues</text>
  <text x="780" y="92" fill="#5f6b7a" font-size="12" text-anchor="middle">open the shared project</text>
  <text x="780" y="110" fill="#5f6b7a" font-size="12" text-anchor="middle">and sync the same way</text>
  <path d="M780 120 L780 176" stroke="#5f6b7a" stroke-width="2" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>
</svg>
